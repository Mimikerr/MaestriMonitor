<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel central · Brainiac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F4EFE4;--surface:#FFFDF7;--surface2:#FAF6EC;--surface3:#EFE8D8;--line:#DDD3BF;--line2:#C6B99F;--fg:#1F2A44;--muted:#5C5446;--ink:#1F2A44;--on-ink:#FFFDF7;--seal:#8A3B12;--ok:#2F6B3A;--attn:#9A5B00;--err:#A8241C;--idle:#6E6555;--e1:0 1px 0 rgba(60,40,10,.08);--e2:0 1px 0 rgba(60,40,10,.06),0 10px 24px -12px rgba(60,40,10,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#12151C;--surface:#1A1E27;--surface2:#212633;--surface3:#2A3040;--line:#343B4B;--line2:#4A5266;--fg:#EDE6D6;--muted:#B3AA98;--ink:#EDE6D6;--on-ink:#12151C;--seal:#E07A4F;--ok:#7DC28A;--attn:#E5B04A;--err:#F07B6F;--idle:#998F7C;--e1:0 1px 0 rgba(0,0,0,.4);--e2:0 14px 30px -12px rgba(0,0,0,.75)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 'Instrument Sans',system-ui,sans-serif}
.ser{font-family:'Fraunces',Georgia,serif}.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mu{color:var(--muted)}
main{max-width:1500px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{margin:0;font:600 26px/1.15 'Fraunces',Georgia,serif}
.stamp{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1.5px solid currentColor;border-radius:3px;font:700 10.5px/1 'Instrument Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.stamp.ok{color:var(--ok)}.stamp.at{color:var(--attn)}.stamp.er{color:var(--err)}.stamp.id{color:var(--idle)}
.sd{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.banner{padding:12px 16px;border:1px solid var(--err);border-left-width:6px;border-radius:6px;background:var(--surface);color:var(--err);font-weight:600}
.usage{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--e1);display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{margin:0;font:600 17px/22px 'Fraunces',Georgia,serif}
.card-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .row{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bar.at i{background:var(--attn)}.bar.er i{background:var(--err)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.agents{display:flex;flex-direction:column}
.ag{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ag:last-child{border-bottom:0}
.ag .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag.maestro .n{font-weight:700}
.ag .p{font-size:11px;color:var(--muted)}
.err-note{font-size:12px;color:var(--err);padding:2px 0 6px}
pre.term{margin:0;padding:10px 12px;background:var(--ink);color:var(--on-ink);border-radius:5px;font:11.5px/1.5 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.steps li{display:flex;gap:8px;align-items:flex-start}
.chk{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:3px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;line-height:1}
.steps .done{color:var(--muted)}.steps .done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps .doing{font-weight:600}.steps .doing .chk{border-color:var(--seal);background:var(--seal);color:var(--surface)}
.prog{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:2px 8px;border:1px solid var(--line2);border-radius:4px;background:var(--surface2);font:11px 'JetBrains Mono',monospace}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="lbl">Brainiac · Painel central</div>
      <h1>Todos os projetos, numa folha</h1>
    </div>
    <div class="live"><span id="live-state" class="stamp id"><span class="sd"></span>conectando</span><span id="stamp-time"></span></div>
  </header>
  <div id="banner"></div>
  <section><div class="lbl" style="margin-bottom:8px">Uso das contas</div><div id="usage" class="usage"></div></section>
  <section><div class="lbl" style="margin-bottom:8px">Projetos</div><div id="projects" class="projects"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = { running: ["ok", "rodando"], stopped: ["id", "parado"], error: ["er", "erro"], starting: ["at", "iniciando"] };
const tone = (p) => (p >= 90 ? "er" : p >= 75 ? "at" : "");
const resets = (iso) => {
  if (!iso) return "";
  const s = Math.round((new Date(iso) - Date.now()) / 60000);
  if (s <= 0) return "renovando";
  return s < 60 ? `renova em ${s} min` : s < 1440 ? `renova em ${Math.round(s / 60)} h` : `renova em ${Math.round(s / 1440)} d`;
};
function renderUsage(rows) {
  $("usage").innerHTML = rows.length ? rows.map((a) => `
    <div class="card"><div class="card-h"><h2>${esc(a.provider)}</h2><span class="mu">${esc(a.label)}</span></div>
    <div class="card-b">${a.windows.map((w) => `
      <div class="meter"><div class="row"><span>${esc(w.label)}</span><span class="mono">${w.percent}%</span></div>
      <div class="bar ${tone(w.percent)}"><i style="width:${Math.min(100, w.percent)}%"></i></div>
      <span class="mu" style="font-size:11px">${esc(resets(w.resets_at))}</span></div>`).join("")}</div></div>`).join("")
    : '<div class="empty">Sem dados de uso.</div>';
}
function renderBranches(b) {
  if (!b) return "";
  const chips = (list) => list.length ? `<div class="chips">${list.map((n) => `<span class="chip">${esc(n.replace(/^origin\//, ""))}</span>`).join("")}</div>` : '<div class="empty">nenhuma</div>';
  return `<div><div class="sec-t"><span class="lbl">Aguardando release</span>${b.commits_na_frente ? `<span class="stamp at">${b.commits_na_frente} commit(s) na frente</span>` : ""}</div>${chips(b.aguardando_release)}</div>
    <div><div class="lbl">Em andamento (ainda fora da integração)</div>${chips(b.em_andamento)}</div>
    <div><div class="lbl">Prontas para limpar (já na release)</div>${chips(b.limpar)}</div>`;
}
function renderPlan(p) {
  if (!p || !p.total) return '<div class="empty">Sem PLANO.md neste projeto.</div>';
  return `<div class="sec-t"><span class="lbl">Plano de ação</span><span class="mu mono">${p.done}/${p.total}</span></div>
    <div class="prog"><i style="width:${Math.round((p.done / p.total) * 100)}%"></i></div>
    <ul class="steps">${p.steps.map((s) => `<li class="${s.state}"><span class="chk">${s.state === "done" ? "✓" : s.state === "doing" ? "▸" : ""}</span><span>${esc(s.text)}</span></li>`).join("")}</ul>`;
}
function renderProject(p) {
  if (!p.encontrado) return `<article class="card"><div class="card-h"><h2>${esc(p.nome)}</h2><span class="stamp er">workspace não encontrado</span></div></article>`;
  const maestro = p.agentes.find((a) => a.maestro);
  const [cls, label] = STATUS[maestro?.status] || ["id", maestro ? maestro.status : "sem maestro"];
  const term = maestro?.terminal?.length ? `<pre class="term">${esc(maestro.terminal.join("\n"))}</pre>` : "";
  return `<article class="card">
    <div class="card-h"><h2>${esc(p.nome)}</h2><span class="mono mu">@${esc(p.apelido)}</span><span class="stamp ${cls}" style="margin-left:auto"><span class="sd"></span>maestro ${esc(label)}</span></div>
    <div class="card-b">
      <div class="agents">${p.agentes.map((a) => {
        const [c, l] = STATUS[a.status] || ["id", a.status];
        return `<div class="ag ${a.maestro ? "maestro" : ""}"><span class="stamp ${c}"><span class="sd"></span>${esc(l)}</span><span class="n">${esc(a.nome)}</span><span class="p">${esc(a.provider)}${a.ultimo_turno ? " · " + esc(a.ultimo_turno) : ""}</span></div>${a.erro ? `<div class="err-note">${esc(a.erro)}</div>` : ""}`;
      }).join("")}</div>
      ${term}
      ${renderPlan(p.plano)}
      ${renderBranches(p.branches)}
    </div></article>`;
}
async function refresh() {
  try {
    const r = await fetch("/api/snapshot", { cache: "no-store" });
    const s = await r.json();
    $("banner").innerHTML = s.ok ? "" : `<div class="banner">Brainiac indisponível: ${esc(s.error)}</div>`;
    $("live-state").className = "stamp " + (s.ok ? "ok" : "er");
    $("live-state").innerHTML = `<span class="sd"></span>${s.ok ? "ao vivo" : "sem conexão"}`;
    $("stamp-time").textContent = "atualizado " + new Date(s.generated_at).toLocaleTimeString("pt-BR");
    if (s.ok) { renderUsage(s.usage); $("projects").innerHTML = s.projects.map(renderProject).join(""); }
  } catch (e) {
    $("live-state").className = "stamp er"; $("live-state").innerHTML = '<span class="sd"></span>painel offline';
  }
}
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
